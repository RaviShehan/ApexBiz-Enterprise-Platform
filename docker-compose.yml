name: apexbiz-enterprise-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: apexbiz-postgres
    environment:
      POSTGRES_DB: apexbiz
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - apexbiz_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: apexbiz-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend/apexbiz-api
    container_name: apexbiz-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/apexbiz?schema=public
      JWT_SECRET: apexbiz_super_secret_change_in_production
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
    container_name: apexbiz-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      - backend

volumes:
  apexbiz_postgres_data:
