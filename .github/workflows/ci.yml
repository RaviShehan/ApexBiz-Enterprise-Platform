name: ApexBiz CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  security-file-check:
    name: Security File Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check that secret env files are not committed
        run: |
          echo "Checking for committed secret environment files..."

          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.local$|(^|/)\.env\.production$'; then
            echo "Secret environment file found in Git."
            echo "Do not commit .env, .env.local, or .env.production files."
            exit 1
          fi

          echo "No secret environment files found."

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/apexbiz-api

    env:
      DATABASE_URL: postgresql://apexbiz_user:apexbiz_password@localhost:5432/apexbiz_db?schema=public
      JWT_SECRET: ci-test-jwt-secret
      REFRESH_TOKEN_SECRET: ci-test-refresh-secret
      ML_SERVICE_URL: http://localhost:8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build backend
        run: npm run build

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_API_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build frontend
        run: npm run build

  ml-service-check:
    name: ML Service Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ml-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ML service dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python files compile
        run: python -m compileall .

      - name: Check FastAPI app imports
        run: python -c "from app import app; print('ML service import successful')"
